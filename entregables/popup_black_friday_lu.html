<!--
  POP-UP BLACK FRIDAY · Licorerías Unidas
  Dónde pegarlo (Shopify): Tienda online → Temas → Personalizar → página de inicio →
  "Agregar sección" → "Liquid personalizado" → pegar todo este bloque → Guardar.
  También funciona pegado justo antes de </body> en layout/theme.liquid (aparece en todas las páginas).

  Para cambiar textos, imagen, enlace o tiempo, edita solo el bloque CONFIG del script (abajo).
-->
<div id="lu-bf-popup" class="lu-bf" hidden>
  <div class="lu-bf__overlay" data-lu-bf-close></div>
  <div class="lu-bf__dialog" role="dialog" aria-modal="true" aria-labelledby="lu-bf-title" tabindex="-1">
    <button type="button" class="lu-bf__close" data-lu-bf-close aria-label="Cerrar">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M13 13L1 1M13 1L1 13" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
    </button>
    <img class="lu-bf__image" src="" alt="" width="1500" height="500">
    <div class="lu-bf__content">
      <h2 class="lu-bf__title" id="lu-bf-title"></h2>
      <p class="lu-bf__text"></p>
      <a class="lu-bf__button" href="#"></a>
    </div>
  </div>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@800&family=Instrument+Sans:wght@400;600&display=swap">
<style>
  .lu-bf,.lu-bf *{box-sizing:border-box}
  .lu-bf{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px}
  .lu-bf[hidden]{display:none!important}
  .lu-bf__overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s ease}
  .lu-bf__dialog{position:relative;width:100%;max-width:760px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;color:rgb(2,2,2);font-family:"Instrument Sans",sans-serif;font-size:14px;line-height:1.7333;opacity:0;transform:translateY(16px);transition:opacity .3s ease,transform .3s ease;outline:none}
  .lu-bf.is-open .lu-bf__overlay{opacity:1}
  .lu-bf.is-open .lu-bf__dialog{opacity:1;transform:none}
  .lu-bf__close{position:absolute;top:12px;right:12px;z-index:1;width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:none;color:#000;cursor:pointer}
  .lu-bf__close:focus-visible{outline:2px solid #000;outline-offset:2px}
  .lu-bf__image{display:block;width:100%;height:auto;aspect-ratio:2000/694;object-fit:cover;background:#1a0606}
  .lu-bf__content{padding:32px 40px 40px;text-align:center}
  .lu-bf__title{margin:0 0 16px;font-family:Epilogue,sans-serif;font-weight:800;font-size:22px;line-height:1.1667;letter-spacing:-.4px;text-transform:uppercase;color:#000}
  .lu-bf__text{margin:14px 0;font-family:"Instrument Sans",sans-serif;font-weight:400;font-size:14px;line-height:1.7333;color:rgb(2,2,2)}
  .lu-bf__text:empty{display:none}
  .lu-bf__button{display:block;width:100%;height:52px;margin-top:24px;padding:0 35px;background:rgb(222,42,42);color:#fff;font-family:"Instrument Sans",sans-serif;font-weight:600;font-size:12px;line-height:52px;letter-spacing:2px;text-transform:uppercase;text-align:center;text-decoration:none;border:0;transition:background .2s ease}
  .lu-bf__button:hover{background:rgb(190,30,30);color:#fff}
  .lu-bf__button:focus-visible{outline:2px solid #000;outline-offset:3px}
  @media (max-width:740px){
    .lu-bf{align-items:flex-end;padding:0}
    .lu-bf__dialog{max-height:100vh;border-radius:10px 10px 0 0;font-size:13px;transform:translateY(100%)}
    .lu-bf__title{font-size:18px;line-height:1.2;letter-spacing:-.3px}
    .lu-bf__text{font-size:13px;margin:13px 0}
    .lu-bf__button{height:48px;line-height:48px;padding:0 30px;font-size:11px;letter-spacing:1.5px}
  }
  @media (prefers-reduced-motion:reduce){.lu-bf__overlay,.lu-bf__dialog{transition:none}}
</style>

<script>
(function () {
  'use strict';

  /* ===== CONFIG: cambia solo esto ===== */
  var CONFIG = {
    imagen:   'https://cdn.shopify.com/s/files/1/0723/4165/1736/files/Coleccion_premium_sobre_marmol_negro_4a28139f-bfa9-4ee8-837c-52323ae43b1a.png?v=1795735813&width=1500',
    imagenAlt:'Colección premium de licores Black Friday en Licorerías Unidas',
    titulo:   '¡LLEGÓ EL BLACK FRIDAY A LICORERÍAS UNIDAS!',
    texto:    'Ahora puedes pagar en 3, 6 o 9 cuotas sin intereses. Elige cualquier botella o uno de nuestros packs en oferta y págalo por partes: 3 cuotas desde S/ 300, 6 desde S/ 500 y 9 desde S/ 900. Disponible hasta el lunes 30 de noviembre.',
    boton:    'VER PACKS EN OFERTA',
    enlace:   'https://licoreriasunidas.pe/collections/black-friday-1',
    segundos: 5,                  /* a los cuántos segundos aparece */
    unaVezPorSesion: true,        /* true = no vuelve a salir hasta que el cliente cierre el navegador */
    ocultarEnUrl: '/collections/black-friday-1' /* no se muestra si el cliente ya está en esta página */
  };
  /* ==================================== */

  var KEY = 'lu-bf-popup-visto';
  var root = document.getElementById('lu-bf-popup');
  if (!root) return;
  if (CONFIG.ocultarEnUrl && location.pathname.indexOf(CONFIG.ocultarEnUrl) === 0) return;
  try { if (CONFIG.unaVezPorSesion && sessionStorage.getItem(KEY)) return; } catch (e) {}

  var dialog = root.querySelector('.lu-bf__dialog');
  var img = root.querySelector('.lu-bf__image');
  img.src = CONFIG.imagen;
  img.alt = CONFIG.imagenAlt;
  root.querySelector('.lu-bf__title').textContent = CONFIG.titulo;
  root.querySelector('.lu-bf__text').textContent = CONFIG.texto;
  var btn = root.querySelector('.lu-bf__button');
  btn.textContent = CONFIG.boton;
  btn.href = CONFIG.enlace;

  var lastFocus = null;

  function otherModalOpen() {
    return !!document.querySelector('.modal[open], .drawer[open], .popover[open]');
  }

  function open() {
    if (otherModalOpen()) { setTimeout(open, 1500); return; }
    lastFocus = document.activeElement;
    root.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    requestAnimationFrame(function () { root.classList.add('is-open'); dialog.focus(); });
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    document.addEventListener('keydown', onKey);
  }

  function close() {
    root.classList.remove('is-open');
    document.documentElement.style.overflow = '';
    document.removeEventListener('keydown', onKey);
    setTimeout(function () { root.hidden = true; }, 300);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function onKey(e) {
    if (e.key === 'Escape') { close(); return; }
    if (e.key === 'Tab') {
      var f = root.querySelectorAll('button, a[href]');
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  root.addEventListener('click', function (e) {
    if (e.target.closest('[data-lu-bf-close]')) close();
  });

  setTimeout(open, Math.max(0, CONFIG.segundos) * 1000);
})();
</script>
